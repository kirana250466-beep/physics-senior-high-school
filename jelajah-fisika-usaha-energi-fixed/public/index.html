<style>
*{box-sizing:border-box}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--cd:#18223a;--tx:#e8edf8;--mu:#9aa7c2;--ln:#2a3654;--ac:#7aa2ff;--ep:#33c9b6;--ek:#ffa94d;--em:#a592ff;--ok:#4cc27a;--no:#ff7b7b;--hd:#0a0f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--cd:#18223a;--tx:#e8edf8;--mu:#9aa7c2;--ln:#2a3654;--ac:#7aa2ff;--ep:#33c9b6;--ek:#ffa94d;--em:#a592ff;--ok:#4cc27a;--no:#ff7b7b;--hd:#0a0f1c;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--hd);color:#fff}
header b{font:700 18px Georgia,serif;margin-right:auto}
nav{display:flex;gap:4px}nav button{border:0;border-radius:99px;padding:7px 14px;background:transparent;color:#cfd8ee;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:#fff;color:#14213d;font-weight:700}#pr{font-size:13px;color:#cfd8ee}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}

.path i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ln);font-style:normal;font-weight:700;font-size:13px}
.path .cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.path .dn i{background:var(--ok);color:#fff}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:18px}
.sub{margin:0 0 10px;color:var(--mu);font-size:14px}
.dots{display:flex;gap:6px;margin-bottom:14px}.dots u{flex:1;height:5px;border-radius:3px;background:var(--ln)}.dots u.on{background:var(--ac)}
h3{font:700 22px/1.25 Georgia,serif;margin:0 0 10px}
.f{background:var(--bg);border-left:4px solid var(--em);border-radius:8px;padding:10px 14px;margin:10px 0;font:italic 19px/1.5 Georgia,serif;overflow-x:auto}
.ex,.tip{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}

ul,ol{padding-left:22px;margin:8px 0}li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}

.o button{text-align:left;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.o .ok{border-color:var(--ok);background:rgba(27,138,70,.16)}.o .no{border-color:var(--no);background:rgba(198,47,47,.14)}
.e{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.nb{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nb button,.go{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ln);color:var(--tx)}
.nb .pri{background:var(--ac);color:var(--hd)}.nb button:disabled{opacity:.4;cursor:not-allowed}
.go{background:rgba(36,87,214,.14);color:var(--ac);padding:8px 14px;font-size:14px;margin-top:4px}
svg{width:100%;height:auto;background:var(--bg);border-radius:10px;display:block}
.tl{stroke:var(--mu);stroke-width:2;fill:none}.fa{stroke:var(--ek);stroke-width:4;stroke-linecap:round}.st{fill:var(--tx);font-size:12px}
.ctl label{display:block;margin-top:10px;font-weight:600;font-size:14px}.ctl b{float:right;font-family:Consolas,monospace;color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
.out{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:15px}.out p{margin:6px 0 0}
.bar{display:grid;grid-template-columns:52px 1fr 76px;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bar div{height:12px;border-radius:6px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%}
.sc{font-weight:700;color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.il{margin:8px 0}.big{fill:var(--tx);font:italic 700 18px Georgia,serif}.wt{fill:var(--cd);font-size:12px;font-weight:700}.wb{fill:var(--cd);font:700 20px Georgia,serif}.em{font-size:32px}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}.ch b{min-width:96px;font-size:14px}.ch span{padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);font-size:13px}.ch i{color:var(--mu);font-style:normal}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;color:var(--ac);padding:6px 0}details>:not(summary){margin-top:8px}
.pb{border:1px solid var(--ln);border-radius:10px;padding:2px 12px;background:var(--bg)}
.stp{counter-reset:s;list-style:none;padding:0;margin:6px 0}.stp li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px}.stp li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--cd);display:grid;place-items:center;font-size:12px;font-weight:700}
.tg{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:rgba(36,87,214,.14);color:var(--ac)}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.tp button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer}
.tp button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.tp .ti{font-size:24px;line-height:1}.tp b{display:block;font-size:14px;line-height:1.25}.tp small{color:var(--mu);font-size:12px}
.key{background:rgba(107,79,216,.12);border:1px solid rgba(107,79,216,.45);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(62px)}}
.spin{animation:spin 4s linear infinite}.sld{animation:slide 2.6s linear infinite}
@media(prefers-reduced-motion:reduce){.spin,.sld{animation:none!important}}

<script>
const $=s=>document.querySelector(s),f=(x,d=1)=>(+x.toFixed(d)).toLocaleString('id-ID');
const DK=['ue1','nw1'],DD=DK.map(k=>{let d={m:{}};try{d=JSON.parse(localStorage.getItem(k))||d}catch(e){}if(!d.m)d.m={};return d});
const sv=()=>{try{localStorage.setItem(DK[S.top],JSON.stringify(DD[S.top]))}catch(e){}};
let S={top:0,tab:'misi',mi:0,st:0,sim:0,pre:null};
const CT=()=>TOP[S.top],D=()=>DD[S.top];
const G=(i,p,l)=>`<button class="go" data-sim="${i}" data-pre='${JSON.stringify(p)}'>${l||'Coba di Wahana'}</button>`;
const M=[
{t:'Usaha',s:'Capek belum tentu usaha menurut fisika',st:[
`<h3>Kapan gaya dianggap bekerja?</h3><p><b>Usaha</b> adalah energi yang dipindahkan sebuah gaya saat benda berpindah. Tanpa perpindahan, tidak ada usaha, sekeras apa pun tenagamu.</p><p>Gaya melakukan usaha jika ada gaya, benda berpindah, dan ada komponen gaya yang <b>searah</b> perpindahan.</p><div class="tip"><b>Uji nalar.</b> Rina mendorong dinding 10 menit: usaha nol karena dinding diam. Dodi mengangkat galon ke dispenser: ada usaha. Andi berjalan mendatar membawa tas: gaya angkat tangannya tegak lurus gerak, usaha nol.</div>`,
`<h3>Rumus usaha</h3><div class="f">W = F · s · cos θ</div><p>W dalam joule (J), F dalam newton, s dalam meter. θ adalah sudut antara <b>gaya</b> dan <b>perpindahan</b>, bukan sudut terhadap lantai.</p><table><tr><th>Sudut θ<th>Usaha<th>Contoh<tr><td>0°<td>positif terbesar<td>mendorong lurus ke depan<tr><td>0° sampai 90°<td>positif<td>koper ditarik tali miring<tr><td>90°<td><b>nol</b><td>gaya normal, gaya sentripetal<tr><td>90° sampai 180°<td>negatif<td>gaya gesek dan rem (180°)</table><p>Usaha negatif berarti gaya mengambil energi sehingga benda melambat. Usaha total adalah jumlah aljabar usaha tiap gaya.</p><div class="ex"><b>Contoh.</b> Koper ditarik 80 N pada sudut 60° sejauh 5 m: W = 80 × 5 × cos 60° = <b>200 J</b>. Jika tali mendatar, W = 400 J.</div>${G(0,{F:80,t:60,s:5})}`,
`<h3>Gaya berat, gaya gesek, dan grafik</h3><ul><li><b>Gaya berat:</b> W = m g (h<sub>awal</sub> − h<sub>akhir</sub>). Turun positif, naik negatif, tidak bergantung bentuk lintasan.</li><li><b>Gaya gesek:</b> W = −f · s, dengan f = μN. Selalu negatif, makin besar jika lintasan makin panjang.</li><li><b>Grafik F–s:</b> usaha sama dengan <b>luas</b> di bawah grafik. Pecah menjadi segitiga dan persegi panjang, lalu jumlahkan.</li></ul><div class="ex"><b>Contoh.</b> Anak 40 kg menaiki tangga 3 m: W<sub>berat</sub> = −40 × 10 × 3 = <b>−1.200 J</b>. Balok ditarik 40 N sejauh 3 m dengan gesek 15 N: W<sub>total</sub> = 120 − 45 = <b>75 J</b>.</div>`],
q:[{q:'Siswa membawa tas sambil berjalan mendatar dengan laju tetap. Usaha gaya angkat tangannya pada tas adalah ...',o:['Positif','Negatif','Nol','Bergantung massa tas'],a:2,e:'Gaya angkat tegak lurus perpindahan (θ = 90°), cos 90° = 0, jadi W = 0.'},
{q:'Gaya 50 N bersudut 37° terhadap perpindahan menggeser benda 8 m (cos 37° = 0,8). Usahanya ...',o:['400 J','320 J','240 J','200 J'],a:1,e:'W = 50 × 8 × 0,8 = 320 J.'}]},
{t:'Energi',s:'Energi kinetik, potensial, dan teorema usaha-energi',st:[
`<h3>Energi dan energi kinetik</h3><p><b>Energi</b> adalah kemampuan melakukan usaha, satuannya joule. Energi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk atau berpindah.</p><div class="f">E<sub>k</sub> = ½ m v²</div><p>Laju dikuadratkan: laju 2 kali berarti E<sub>k</sub> 4 kali. Ubah km/jam ke m/s dengan membagi 3,6.</p><div class="ex"><b>Contoh.</b> Mobil 1.000 kg pada 20 m/s: E<sub>k</sub> = ½ × 1.000 × 20² = <b>200 kJ</b>. Pada 40 m/s menjadi 800 kJ, sebab itu tabrakan cepat jauh lebih berbahaya.</div>`,
`<h3>Teorema usaha dan energi</h3><div class="f">W<sub>total</sub> = ΔE<sub>k</sub> = ½ m v₂² − ½ m v₁²</div><p>Usaha total positif membuat benda makin cepat, negatif membuatnya melambat, nol membuat lajunya tetap. Cocok untuk soal gaya, jarak, dan laju tanpa waktu.</p><div class="ex"><b>Contoh 1.</b> Balok 2 kg diam, didorong 16 N sejauh 4 m di lantai licin: 64 = ½ × 2 × v², jadi <b>v = 8 m/s</b>.</div><div class="ex"><b>Contoh 2.</b> Mobil 800 kg pada 20 m/s direm 4.000 N: −4.000 s = −160.000, jadi <b>s = 40 m</b>. Laju 2 kali berarti jarak rem 4 kali.</div>`,
`<h3>Energi potensial dan jenis gaya</h3><div class="f">E<sub>p</sub> = m g h</div><div class="f">F = k x &nbsp;&nbsp; E<sub>p pegas</sub> = ½ k x²</div><ul><li>h diukur dari titik acuan pilihanmu, jadi E<sub>p</sub> bisa nol atau negatif. Yang bermakna adalah perubahannya: W<sub>berat</sub> = −ΔE<sub>p</sub>.</li><li>k konstanta pegas (N/m), x simpangan dari panjang alami (m).</li><li><b>Gaya konservatif</b> (berat, pegas): usaha hanya bergantung posisi awal dan akhir, energi mekanik tetap. <b>Non-konservatif</b> (gesek, hambatan udara): usaha bergantung lintasan, energi mekanik berubah.</li></ul><div class="ex"><b>Contoh.</b> Pegas k = 200 N/m ditarik 0,1 m: F = 20 N dan E<sub>p</sub> = <b>1 J</b>. Menariknya dari 0,1 sampai 0,3 m butuh ½ × 200 × (0,3² − 0,1²) = <b>8 J</b>.</div>${G(2,{k:200,x:.1,m:.5})}`],
q:[{q:'Laju mobil menjadi 3 kali semula. Energi kinetiknya menjadi ...',o:['3 kali','6 kali','9 kali','27 kali'],a:2,e:'E<sub>k</sub> sebanding dengan v², jadi 3² = 9.'},
{q:'Buku 2 kg berada di meja setinggi 0,8 m dari lantai. Energi potensialnya terhadap lantai (g = 10 m/s²) ...',o:['1,6 J','8 J','16 J','160 J'],a:2,e:'E<sub>p</sub> = 2 × 10 × 0,8 = 16 J.'}]},
{t:'Energi mekanik',s:'Kekekalan energi, gesekan, dan jurus soal',st:[
`<h3>Hukum Kekekalan Energi Mekanik</h3><div class="f">E<sub>m</sub> = E<sub>p</sub> + E<sub>k</sub> = m g h + ½ m v²</div><p>Jika hanya gaya konservatif yang bekerja (lintasan licin, tanpa hambatan udara), energi mekanik di setiap titik sama:</p><div class="f">E<sub>m1</sub> = E<sub>m2</sub> &nbsp;→&nbsp; v₂² = v₁² + 2g(h₁ − h₂)</div><p>Gaya normal tegak lurus gerak, usahanya nol. Massa tercoret dan bentuk lintasan tidak berpengaruh, hanya beda tinggi.</p><ul><li>Jatuh atau meluncur dari diam setinggi h: <b>v = √(2gh)</b></li><li>Dilempar ke atas dengan v₀: <b>h<sub>maks</sub> = v₀² / 2g</b></li><li>Pegas melontarkan benda: <b>v = x√(k/m)</b></li></ul><div class="ex"><b>Contoh.</b> Roller coaster dilepas dari diam di 40 m. Di ketinggian 15 m: v² = 2 × 10 × 25 = 500, jadi <b>v ≈ 22,4 m/s</b>.</div>${G(1,{H:5,m:2,f:0,p:.5})}`,
`<h3>Jika ada gesekan</h3><div class="f">E<sub>m2</sub> = E<sub>m1</sub> − f · s</div><p>Energi total tetap kekal. Yang berkurang adalah energi <b>mekanik</b>, karena sebagian berubah menjadi kalor dan bunyi.</p><div class="ex"><b>Contoh.</b> Balok 2 kg dari diam di puncak bidang miring 5 m (panjang 10 m), tiba di dasar dengan 6 m/s. E<sub>m1</sub> = 100 J, E<sub>m2</sub> = 36 J, jadi kalor = <b>64 J</b> dan f = 64/10 = <b>6,4 N</b>.</div>${G(1,{H:5,m:2,f:6.4,p:1})}<p><b>Bola memantul</b> tidak kembali ke tinggi semula karena tumbukan dengan lantai membuang energi. Tinggi pantulan berikutnya h′ = e² · h. Jatuh dari 8 m lalu memantul 4 m berarti e² = ½, pantulan kedua 2 m.</p>`,
`<h3>Jurus 4 langkah soal energi</h3><ol><li><b>Tentukan dua keadaan,</b> awal (1) dan akhir (2): tinggi, laju, simpangan pegas.</li><li><b>Pilih titik acuan</b> h = 0, biasanya titik terendah.</li><li><b>Cek gesekan.</b> Licin: E<sub>m1</sub> = E<sub>m2</sub>. Kasar: E<sub>m2</sub> = E<sub>m1</sub> − f s.</li><li><b>Tulis persamaan,</b> coret massa bila semua suku memuatnya, hitung, lalu cek masuk akal atau tidak.</li></ol><div class="tip">Soal menanyakan laju atau tinggi di dua titik tanpa menyebut waktu? Pakai energi, biasanya lebih cepat daripada hukum Newton.</div>`],
q:[{q:'Dua bola identik dilepas dari tinggi sama pada lintasan licin, satu lurus dan satu melengkung. Laju di dasar ...',o:['Lebih besar di lintasan lurus','Lebih besar di lintasan melengkung','Sama','Bergantung massa'],a:2,e:'v = √(2gh). Hanya beda tinggi yang berpengaruh.'},
{q:'Anak 30 kg meluncur dari ketinggian 3,2 m pada seluncuran licin. Laju di dasar (g = 10 m/s²) ...',o:['4 m/s','6,4 m/s','8 m/s','10 m/s'],a:2,e:'v = √(2 × 10 × 3,2) = √64 = 8 m/s. Massa anak tidak berpengaruh.'}]},
{t:'Daya',s:'Daya, efisiensi, dan energi listrik',st:[
`<h3>Daya: seberapa cepat usaha dilakukan</h3><div class="f">P = W / t = F · v</div><p>Satuannya watt: 1 W = 1 J/s. 1 kW = 1.000 W dan 1 hp ≈ 746 W. Karena P = F v, mobil melambat di tanjakan: daya mesin tetap, gaya yang dibutuhkan lebih besar, jadi laju turun.</p><div class="ex"><b>Contoh.</b> Lift 800 kg naik 15 m dalam 20 s dengan laju tetap: W = 800 × 10 × 15 = 120.000 J, maka P = 120.000 / 20 = <b>6 kW</b>.</div>`,
`<h3>Energi listrik dan efisiensi</h3><div class="f">W = P · t &nbsp;&nbsp; 1 kWh = 3,6 × 10⁶ J</div><div class="f">η = (W<sub>keluaran</sub> / W<sub>masukan</sub>) × 100%</div><p><b>kWh adalah satuan energi, bukan daya.</b> Efisiensi selalu kurang dari 100% karena sebagian energi menjadi kalor dan bunyi. Energi itu tidak hilang, hanya tidak berguna.</p><div class="ex"><b>Contoh 1.</b> AC 600 W menyala 8 jam sehari selama 30 hari: 0,6 × 8 × 30 = 144 kWh. Pada Rp1.500 per kWh, biayanya <b>Rp216.000</b>.</div><div class="ex"><b>Contoh 2.</b> Pompa mengangkat 120 kg air per menit setinggi 10 m dengan efisiensi 80%: P<sub>keluar</sub> = 12.000/60 = 200 W, jadi P<sub>masuk</sub> = 200/0,8 = <b>250 W</b>.</div>`],
q:[{q:'Manakah yang merupakan satuan energi?',o:['Watt','Kilowatt','Kilowatt-jam','Joule per sekon'],a:2,e:'kWh adalah energi yang dipakai alat 1 kW selama 1 jam.'},
{q:'Motor menerima energi 500 J dan menghasilkan energi gerak 400 J. Efisiensinya ...',o:['20%','80%','100%','125%'],a:1,e:'η = 400/500 × 100% = 80%. Sisanya 100 J menjadi kalor dan bunyi.'}]},
{t:'Sumber energi',s:'Transformasi energi dan hemat energi',st:[
`<h3>Dari mana listrik berasal?</h3><p><b>Terbarukan:</b> matahari, angin, air, panas bumi, biomassa. <b>Tak terbarukan:</b> minyak bumi, gas alam, batu bara, uranium. Indonesia berada di Cincin Api Pasifik dan khatulistiwa, jadi kaya panas bumi dan sinar matahari.</p><table><tr><th>Pembangkit<th>Rantai perubahan energi<tr><td>PLTA<td>potensial air → kinetik air → kinetik turbin → listrik<tr><td>PLTU<td>kimia batu bara → kalor → kinetik uap → kinetik turbin → listrik<tr><td>PLTS<td>cahaya matahari → listrik<tr><td>PLTB<td>kinetik angin → kinetik baling-baling → listrik<tr><td>PLTP<td>kalor bumi → kinetik uap → kinetik turbin → listrik</table><p>Di PLTA, ketinggian bendungan menentukan E<sub>p</sub> yang tersedia: P = m g h / t.</p>`,
`<h3>Energi kekal, mengapa tetap hemat?</h3><p>Setiap perubahan bentuk membuang sebagian energi menjadi kalor yang tersebar dan sulit dipakai lagi. Jumlah energi tetap, tetapi <b>energi yang berguna</b> berkurang.</p><ul><li>Matikan lampu dan cabut charger yang tidak dipakai.</li><li>Pilih alat berefisiensi tinggi, misalnya lampu LED.</li><li>Manfaatkan cahaya alami; jalan kaki atau naik angkutan umum untuk jarak dekat.</li><li>Rawat mesin agar gesekan dan energi terbuang berkurang.</li></ul>`],
q:[{q:'Rantai perubahan energi pada PLTA yang benar ...',o:['kimia → kalor → listrik','potensial air → kinetik air → kinetik turbin → listrik','cahaya → listrik','kinetik angin → listrik'],a:1,e:'Air di bendungan menyimpan E<sub>p</sub>, jatuh menjadi E<sub>k</sub> air, memutar turbin, lalu generator menghasilkan listrik.'},
{q:'Jika energi kekal, mengapa kita tetap perlu berhemat?',o:['Jumlah energi berkurang','Energi berguna berubah menjadi kalor yang tersebar','Energi musnah oleh gesekan','Energi tidak bisa berubah bentuk'],a:1,e:'Yang berkurang adalah energi yang masih berguna, bukan jumlah totalnya.'}]},
{t:'Jurus kilat',s:'Rangkuman untuk dibaca sebelum ujian',st:[
`<h3>Empat hubungan emas</h3><table><tr><th>Hubungan<th>Dipakai saat<tr><td>W<sub>total</sub> = ΔE<sub>k</sub><td>ada gaya, jarak, dan laju<tr><td>W<sub>berat</sub> = −ΔE<sub>p</sub> = mg(h<sub>awal</sub> − h<sub>akhir</sub>)<td>benda naik atau turun<tr><td>W<sub>pegas</sub> = −ΔE<sub>p pegas</sub><td>ada pegas<tr><td>W<sub>nk</sub> = ΔE<sub>m</sub><td>ada gesekan atau gaya dorong</table><div class="tip">Hampir semua soal berpola sama: tentukan keadaan awal dan akhir, cek gesekan, tulis energi di kedua titik, lalu hitung.</div>`,
`<h3>Rumus cepat</h3><table><tr><td>Usaha<td>W = F s cos θ<tr><td>Usaha gesek<td>W = −f s, f = μN<tr><td>Energi kinetik<td>½ m v²<tr><td>Energi potensial<td>m g h<tr><td>Pegas<td>F = k x, E<sub>p</sub> = ½ k x²<tr><td>Energi mekanik<td>E<sub>m</sub> = E<sub>k</sub> + E<sub>p</sub><tr><td>Kekekalan<td>v₂² = v₁² + 2g(h₁ − h₂)<tr><td>Dengan gesekan<td>E<sub>m2</sub> = E<sub>m1</sub> − f s<tr><td>Daya<td>P = W/t = F v<tr><td>Energi listrik<td>W = P t; 1 kWh = 3,6 × 10⁶ J<tr><td>Efisiensi<td>η = W<sub>keluar</sub>/W<sub>masuk</sub> × 100%</table>`,
`<h3>Kata kunci dan jebakan</h3><ul><li>“licin”, “tanpa gesekan”: E<sub>m1</sub> = E<sub>m2</sub>. “Kasar”, “ada gaya gesek”: E<sub>m</sub> berkurang f s.</li><li>“dilepas”, “dari diam”: v awal = 0. “Berhenti”, “titik tertinggi”: v = 0.</li><li>“Laju tetap”: usaha total nol, gaya dorong = gaya hambatan.</li><li>“Pegas kembali ke panjang alami”: x = 0.</li></ul><p><b>Kesalahan umum:</b> satuan belum seragam (g ke kg, km/jam ke m/s, cm ke m), lupa laju awal, salah sudut θ, lupa mengkuadratkan atau lupa ½, menganggap E<sub>p</sub> selalu positif, memakai E<sub>m1</sub> = E<sub>m2</sub> saat ada gesekan, dan mengira kWh satuan daya.</p>`]}];

ST=t=>String(t).replace(/_(\w+)/g,'<tspan style="baseline-shift:sub;font-size:75%">$1</tspan>'),

XC=(x,y,t,c,a='middle',z=12)=>`<text x="${x}" y="${y}" text-anchor="${a}" style="fill:${c};font-size:${z}px;font-weight:700">${ST(t)}</text>`,
XB=(x,y,t,a='middle',z=13)=>`<text x="${x}" y="${y}" text-anchor="${a}" style="fill:var(--tx);font-size:${z}px;font-weight:700">${ST(t)}</text>`,
AS=(a,b,c,d,k=EK,w=2.5)=>{const t=Math.atan2(d-b,c-a),p=s=>`${c-7*Math.cos(t+s)},${d-7*Math.sin(t+s)}`;return `<line x1="${a}" y1="${b}" x2="${c-3*Math.cos(t)}" y2="${d-3*Math.sin(t)}" style="stroke:${k};stroke-width:${w};stroke-linecap:round"/><polygon points="${c},${d} ${p(-.45)} ${p(.45)}" style="fill:${k}"/>`},
DL=(a,b,c,d,k=MU)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:${k};stroke-width:1.5;stroke-dasharray:4 3"/>`,
BK=(x,y,w,h,c,t='')=>R(x,y,w,h,c)+(t?`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" class="wt">${t}</text>`:''),

TRK=(x,y)=>R(x,y-36,52,30,EK)+R(x+52,y-26,22,20,AC)+O(x+14,y-2,8,'var(--tx)')+O(x+60,y-2,8,'var(--tx)'),
BIKE=(x,y)=>`<g class="tl"><circle cx="${x}" cy="${y}" r="9"/><circle cx="${x+28}" cy="${y}" r="9"/><path d="M${x} ${y}L${x+13} ${y-14}L${x+28} ${y}M${x+13} ${y-14}L${x+10} ${y-20}M${x+20} ${y-14}L${x+28} ${y}"/></g>`,
PL=(x,y,d=25)=>`<g transform="rotate(${d} ${x} ${y+34})">${PP(x,y)}</g>`,
SPR=(x1,x2,y,n=9,h=8)=>{const p=[`${x1},${y}`];for(let i=1;i<n;i++)p.push(`${x1+(x2-x1)*i/n},${y+(i%2?-h:h)}`);p.push(`${x2},${y}`);return `<polyline class="tl" points="${p.join(' ')}"/>`},

const NM=[
{t:'Gaya',s:'Dinamika: mengapa benda bergerak?',st:[
`<h3>Mengapa benda bergerak?</h3><div class="key"><b>Gaya</b> adalah tarikan atau dorongan yang mengubah keadaan gerak benda. Gaya itu besaran <b>vektor</b> (punya besar dan arah), satuannya <b>newton (N)</b>.</div><p><b>Kinematika</b> hanya menggambarkan gerak: kecepatan, percepatan, lintasan. <b>Dinamika</b> menjawab pertanyaan “mengapa benda bergerak seperti itu?”, dan jawabannya selalu berkaitan dengan gaya.</p><p>Sebuah gaya dapat membuat benda mulai bergerak, berhenti, berbelok, atau berubah lajunya.</p>`,
`<h3>Dari Aristoteles ke Newton</h3><div class="key">Newton menyempurnakan gagasan Galileo menjadi <b>tiga hukum gerak</b>, fondasi mekanika klasik yang kita pelajari sampai sekarang.</div><p>Aristoteles (abad ke-4 SM) mengira benda butuh gaya terus-menerus agar tetap bergerak. Pandangan keliru ini bertahan hampir 2000 tahun. Galileo membantahnya lewat percobaan bidang miring: tanpa gesekan, benda yang bergerak akan terus bergerak. Newton lalu merumuskannya menjadi tiga hukum dalam buku <i>Principia</i> (1687).</p>`],
q:[{q:'Besaran yang dapat membuat benda mulai bergerak, berhenti, atau berbelok disebut ...',o:['Massa','Gaya','Kelajuan','Jarak'],a:1,e:'Gaya adalah tarikan atau dorongan yang mengubah keadaan gerak benda. Gaya termasuk besaran vektor dengan satuan newton (N).'},
{q:'Cabang mekanika yang menyelidiki penyebab gerak benda, yaitu gaya, disebut ...',o:['Kinematika','Dinamika','Optika','Termodinamika'],a:1,e:'Kinematika hanya menggambarkan gerak (kecepatan, percepatan, lintasan). Dinamika menjawab mengapa benda bergerak seperti itu, dan jawabannya adalah gaya.'}]},

{t:'Hukum I',s:'Kelembaman: tanpa gaya total, gerak tak berubah',st:[
`<h3>Hukum I: resultan nol, gerak tetap</h3><div class="f">ΣF = 0 &nbsp;→&nbsp; a = 0</div><div class="key">Jika resultan gaya nol, benda yang diam <b>tetap diam</b> dan benda yang bergerak <b>tetap lurus beraturan</b>. Sifat mempertahankan keadaan gerak ini disebut <b>inersia</b>.</div><div class="ex"><b>Contoh.</b> Mobil direm mendadak, tubuhmu terdorong ke depan. Tidak ada gaya yang mendorong ke depan: mobil sudah berhenti, tubuhmu masih mempertahankan lajunya.</div><p>Bunyi Hukum I Newton: setiap benda akan tetap diam atau bergerak lurus beraturan, kecuali ada gaya total (resultan gaya) yang bekerja untuk mengubah keadaan tersebut.</p><p>Makin besar massa benda, makin besar inersianya. Itu sebabnya mobil yang melaju jauh lebih sulit dihentikan mendadak daripada sepeda.</p><p>Ingat: pada benda diam, gaya berat w dan gaya normal N sama besar dan saling meniadakan. Keduanya bukan pasangan aksi-reaksi (dibahas di Hukum III).</p>`],
q:[{q:'Penumpang bus terdorong ke depan ketika bus direm mendadak. Peristiwa ini dijelaskan oleh ...',o:['Hukum I Newton','Hukum II Newton','Hukum III Newton','Hukum Hooke'],a:0,e:'Tubuh penumpang cenderung mempertahankan kecepatannya semula (inersia). Bus sudah melambat, tubuh belum. Ini penjelasan Hukum I, bukan karena ada gaya yang mendorong ke depan.'},
{q:'Benda bergerak pada lantai licin sempurna dengan kecepatan tetap. Resultan gaya pada benda ...',o:['Searah gerak','Berlawanan arah gerak','Nol','Sama dengan beratnya'],a:2,e:'Kecepatan tetap berarti percepatan nol (GLB). Menurut Hukum I, itu terjadi jika resultan gaya nol. Benda tidak butuh dorongan untuk mempertahankan geraknya.'}]},

{t:'Hukum II',s:'ΣF = m a: gaya, massa, dan percepatan',st:[
`<h3>Gaya, massa, dan percepatan</h3><div class="f">ΣF = m · a</div><div class="key">Percepatan <b>sebanding dengan resultan gaya</b> dan searah dengannya, serta <b>berbanding terbalik dengan massa</b>: a = ΣF / m.</div><div class="ex"><b>Contoh.</b> Balok 2 kg didorong 10 N di lantai licin: a = 10 / 2 = <b>5 m/s²</b>.</div>${G(0,{F:10,m:2,t:2})}<p>Bunyi Hukum II Newton: percepatan yang dialami suatu benda berbanding lurus dengan resultan gaya yang bekerja padanya, dan berbanding terbalik dengan massa benda tersebut.</p><p>Satuan newton ditetapkan dari rumus ini: 1 N = 1 kg·m/s².</p>`,
`<h3>Asal-mula F = m a</h3><div class="f">ΣF = Δp / Δt = m · Δv / Δt = m a</div><div class="tip"><b>1 newton</b> adalah gaya yang membuat benda 1 kg mendapat percepatan 1 m/s².</div><p>Newton sebenarnya merumuskan hukumnya lewat <b>momentum</b> (p = m v): gaya adalah laju perubahan momentum. Untuk benda bermassa tetap (kasus SMA), massa dikeluarkan dan yang berubah hanya kecepatan, sehingga Δv/Δt = a.</p><p>Jadi F = m a adalah bentuk sederhana dari konsep yang lebih dalam. Pemahaman ini berguna di bab Impuls dan Momentum, karena akar rumusnya sama.</p>`],
q:[{q:'Gaya resultan 12 N bekerja pada benda 3 kg di lantai licin. Percepatannya ...',o:['0,25 m/s²','4 m/s²','9 m/s²','36 m/s²'],a:1,e:'ΣF = m a, jadi a = ΣF / m. a = 12 / 3 = 4 m/s².'},
{q:'Gaya yang sama diberikan pada benda A (2 kg) dan benda B (6 kg). Perbandingan percepatan A : B ...',o:['1 : 3','3 : 1','1 : 1','2 : 3'],a:1,e:'Pada gaya yang sama, percepatan berbanding terbalik dengan massa. Jadi a<sub>A</sub> : a<sub>B</sub> = ½ : ⅙ = 3 : 1.'}]},

{t:'Hukum III',s:'Aksi-reaksi bekerja pada dua benda berbeda',st:[
`<h3>Aksi dan reaksi: saling dorong</h3><div class="f">F<sub>AB</sub> = −F<sub>BA</sub></div><div class="key">Sama besar, berlawanan arah, dan bekerja pada <b>benda yang berbeda</b>. Karena itu keduanya tidak pernah saling meniadakan.</div><p>Bunyi Hukum III Newton: jika benda A memberikan gaya (aksi) pada benda B, maka benda B memberikan gaya (reaksi) pada benda A yang sama besar namun berlawanan arah. Tanda negatif menunjukkan arah yang berlawanan.</p><p>Contoh klasik: saat mendayung perahu, dayung mendorong air ke belakang (aksi), dan air mendorong balik dayung serta perahu ke depan (reaksi). Reaksi inilah yang membuat perahu maju.</p>`,
`<h3>Jebakan: berat dan normal bukan pasangan</h3><div class="tip"><b>Tes cepat.</b> Pasangan aksi-reaksi bekerja pada <b>dua benda berbeda</b>. Jika dua gaya sama besar dan berlawanan tetapi bekerja pada <b>benda yang sama</b>, itu bukan pasangan aksi-reaksi.</div><p>Gaya berat w dan gaya normal N pada buku yang diam sama-sama bekerja pada buku, jadi keduanya bukan pasangan. Pasangan reaksi N adalah gaya tekan buku pada meja. Pasangan reaksi w adalah tarikan buku pada Bumi.</p>`],
q:[{q:'Buku diam di atas meja. Pasangan aksi-reaksi dari gaya normal pada buku (oleh meja) adalah ...',o:['Gaya berat buku','Gaya tekan buku pada meja','Gaya gesek meja','Gaya tarik Bumi pada meja'],a:1,e:'Gaya normal adalah gaya meja pada buku (aksi). Reaksinya adalah gaya buku pada meja, yaitu gaya tekan buku. Berat dan normal sama besar tetapi bekerja pada benda yang sama, jadi bukan pasangan aksi-reaksi.'},
{q:'Perahu bergerak maju saat dayung mendorong air ke belakang. Gaya yang mendorong perahu ke depan adalah ...',o:['Gaya dayung pada air','Gaya air pada dayung','Gaya berat perahu','Gaya normal tanah'],a:1,e:'Dayung mendorong air ke belakang (aksi). Air mendorong balik dayung dan perahu ke depan (reaksi). Gaya reaksi inilah yang menggerakkan perahu.'}]},

{t:'Gaya-gaya',s:'Berat, normal, gesekan, tegangan tali, dan pegas',st:[
`<h3>Berat dan gaya normal</h3><div class="f">w = m g &nbsp;&nbsp; (g ≈ 10 m/s²)</div><div class="key"><b>Massa</b> (kg) tetap di mana saja. <b>Berat</b> (N) bergantung pada percepatan gravitasi tempat benda berada. Gaya <b>normal</b> selalu tegak lurus bidang sentuh.</div><div class="ex"><b>Contoh.</b> Astronaut bermassa 60 kg: berat di Bumi ±600 N, di Bulan ±96 N (g Bulan ≈ 1,6 m/s²). Massanya tetap 60 kg.</div><p>Gaya berat adalah gaya tarik gravitasi Bumi pada benda, penerapan Hukum II dengan percepatan g. Gaya normal adalah reaksi permukaan terhadap benda yang menekannya (berkaitan dengan Hukum III).</p>`,
`<h3>Gesekan: diam atau bergerak?</h3><div class="f">f<sub>s</sub> ≤ μ<sub>s</sub> N &nbsp;&nbsp; f<sub>k</sub> = μ<sub>k</sub> N</div><div class="key">Gesekan selalu <b>melawan</b> gerak (atau kecenderungan gerak). Umumnya μ<sub>s</sub> &gt; μ<sub>k</sub>: <b>memulai</b> gerak lebih berat daripada <b>menjaganya</b>.</div><div class="ex"><b>Contoh.</b> Balok 10 kg, μ<sub>s</sub> = 0,4 dan μ<sub>k</sub> = 0,3, sehingga N = 100 N. Didorong 30 N: tetap diam, f = 30 N (kurang dari 40 N). Didorong 50 N: bergerak, f = 30 N, a = (50 − 30)/10 = <b>2 m/s²</b>.</div>${G(1,{F:50,m:10,ms:.4,mk:.3})}<table><tr><th>Jenis<th>Kapan bekerja<th>Rumus<tr><td>Statis (f<sub>s</sub>)<td>Benda belum bergerak, meski didorong<td>f<sub>s</sub> ≤ μ<sub>s</sub> N<tr><td>Kinetis (f<sub>k</sub>)<td>Benda sudah bergerak atau meluncur<td>f<sub>k</sub> = μ<sub>k</sub> N</table><p>Koefisien gesek μ adalah bilangan hasil percobaan (tanpa satuan) yang menggambarkan kekasaran relatif dua permukaan.</p>`,
`<h3>Tegangan tali dan gaya pegas</h3><div class="f">F = −k x &nbsp;&nbsp; (Hukum Hooke)</div><div class="key">Tali <b>menarik</b> benda: gaya tegangan T menjauhi benda, searah tali. Pegas selalu <b>memulihkan</b>: gayanya berlawanan arah simpangan.</div><div class="ex"><b>Contoh.</b> Pegas k = 200 N/m ditarik 0,1 m: F = 200 × 0,1 = <b>20 N</b>, arahnya menarik kembali ke posisi setimbang.</div>${XL(0,1,2,'Energi tersimpan di pegas →')}<p>k adalah konstanta pegas (N/m), x adalah simpangan dari posisi setimbang (m). Tanda negatif menunjukkan gaya pegas berusaha mengembalikan benda ke posisi awal.</p>`],
q:[{q:'Balok 5 kg di lantai kasar (μ<sub>s</sub> = 0,5; μ<sub>k</sub> = 0,4; g = 10 m/s²) didorong 20 N dan tetap diam. Gaya gesek yang bekerja ...',o:['0 N','20 N','25 N','50 N'],a:1,e:'N = m g = 50 N, sehingga gesekan statis maksimum = 0,5 × 50 = 25 N. Dorongan 20 N belum melampaui 25 N, jadi balok diam. Pada benda diam, gesekan statis sama dengan gaya dorong, yaitu 20 N.'},
{q:'Sebuah pegas ditarik ke kanan sejauh x dari posisi setimbang. Gaya pegas pada benda yang menariknya ...',o:['Ke kanan','Ke kiri','Nol','Tegak lurus arah tarikan'],a:1,e:'Menurut Hukum Hooke F = −kx, tanda negatif berarti gaya pegas melawan arah simpangan. Pegas berusaha mengembalikan benda ke posisi setimbang.'}]},

{t:'Strategi soal',s:'Lima langkah dan bidang miring',st:[
`<h3>Lima langkah anti-bingung</h3><div class="tip"><b>Penting.</b> Di diagram benda bebas, gambar hanya gaya yang bekerja <b>pada benda itu</b>. Jangan gambar gaya reaksinya, karena reaksi bekerja pada benda lain.</div><p>Urutan ini berlaku untuk hampir semua soal Hukum Newton, dari lantai datar sampai bidang miring: isolasi satu benda, pilih sumbu searah gerak, uraikan gaya yang miring, tulis ΣF = m a pada tiap sumbu, lalu selesaikan.</p>`,
`<h3>Bidang miring: uraikan berat</h3><div class="f">N = m g cos θ</div><div class="f">m g sin θ − f = m a</div><div class="ex"><b>Contoh.</b> Balok 4 kg meluncur pada bidang miring licin 30°: a = g sin 30° = 10 × 0,5 = <b>5 m/s²</b>. Massa tercoret, jadi tidak berpengaruh.</div>${G(2,{th:30,mu:0,m:4})}<div class="tip"><b>Jebakan.</b> Pada bidang miring, N <b>bukan</b> m g. Hanya komponen m g cos θ yang ditahan bidang.</div><p>Gaya berat selalu vertikal ke bawah, gaya normal tegak lurus permukaan, gaya gesek sejajar permukaan melawan gerak. Pilih sumbu sejajar bidang, lalu uraikan berat menjadi komponen sejajar (m g sin θ) dan tegak lurus (m g cos θ).</p><p>Jika ada gesekan, percepatan meluncur ke bawah: a = g (sin θ − μ cos θ).</p>`],
q:[{q:'Pada diagram benda bebas sebuah balok di lantai, gaya yang TIDAK boleh digambar adalah ...',o:['Gaya berat balok','Gaya normal dari lantai','Gaya balok pada lantai','Gaya gesek dari lantai'],a:2,e:'Diagram benda bebas hanya memuat gaya yang bekerja pada benda yang ditinjau. Gaya balok pada lantai bekerja pada lantai (reaksi dari N), jadi tidak digambar.'},
{q:'Balok 6 kg meluncur pada bidang miring licin bersudut 30° (g = 10 m/s²). Percepatan balok ...',o:['2,5 m/s²','5 m/s²','5√3 m/s²','10 m/s²'],a:1,e:'Pada bidang licin hanya komponen berat sejajar bidang yang menggerakkan balok: ΣF = m g sin θ. Jadi a = g sin 30° = 10 × 0,5 = 5 m/s². Massa tercoret.'}]},

{t:'Gerak melingkar',s:'Percepatan dan gaya sentripetal',st:[
`<h3>Laju tetap, tetap dipercepat</h3><div class="f">a<sub>s</sub> = v² / r = ω² r</div><div class="f">ω = 2πf = 2π / T &nbsp;&nbsp; v = ω r</div><div class="key">Besar laju tetap, tetapi <b>arah</b> kecepatan terus berubah. Perubahan arah inilah percepatan, dan selalu mengarah ke <b>pusat</b> lingkaran.</div><p>Asal-mula rumus: segitiga posisi (r, r, busur kecil Δs) sebangun dengan segitiga kecepatan (v, v, Δv), sehingga Δv / v = Δs / r. Bagi dengan Δt: Δv/Δt = (v / r)(Δs/Δt), yaitu a = v² / r. Karena v = ω r, maka a = ω² r.</p><p>f adalah frekuensi (putaran per detik, Hz), T adalah periode (waktu satu putaran penuh, sekon), ω adalah kecepatan sudut (rad/s).</p>`,
`<h3>Gaya sentripetal: resultan, bukan gaya baru</h3><div class="f">F<sub>s</sub> = m a<sub>s</sub> = m v² / r = m ω² r</div><div class="key">Karena ada percepatan, pasti ada gaya penyebabnya (Hukum II). <b>Gaya sentripetal</b> adalah <b>resultan</b> gaya-gaya nyata yang kebetulan mengarah ke pusat lintasan.</div><div class="tip"><b>Jebakan.</b> Jangan menggambar F<sub>s</sub> sebagai gaya tambahan di samping tegangan tali, gravitasi, atau gaya normal. F<sub>s</sub> adalah nama untuk jumlah gaya-gaya itu.</div><p>Tali memberi tegangan, Bulan mengorbit karena gravitasi Bumi, mobil menikung karena gesekan ban, dan di dasar loop resultan N − w yang menuju pusat.</p>`,
`<h3>Contoh: bola diputar dengan tali</h3><div class="ex"><b>Soal.</b> Bola 0,5 kg diikat tali sepanjang 0,2 m dan diputar horizontal. Bola berputar 7 kali dalam 2 detik. Tegangan talinya <b>≈ 48 N</b>.</div>${G(3,{r:.2,fr:3.5,m:.5})}<p>Satu-satunya gaya horizontal pada bola adalah tegangan tali, sehingga T = F<sub>s</sub>. Frekuensi f = 7/2 = 3,5 Hz, lalu ω = 2πf = 7π ≈ 22 rad/s (dengan π = 22/7). Maka T = m ω² r = 0,5 × 22² × 0,2 = 48,4 N.</p>`],
q:[{q:'Benda bergerak melingkar beraturan dengan laju tetap. Pernyataan yang benar tentang percepatannya ...',o:['Nol karena laju tetap','Searah dengan kecepatan','Menuju pusat lingkaran','Menjauhi pusat lingkaran'],a:2,e:'Laju tetap, tetapi arah kecepatan terus berubah sehingga ada percepatan. Percepatan sentripetal a<sub>s</sub> = v²/r selalu mengarah ke pusat lingkaran.'},
{q:'Benda 2 kg bergerak melingkar beraturan berjari-jari 0,5 m dengan laju 3 m/s. Gaya sentripetalnya ...',o:['9 N','18 N','36 N','72 N'],a:2,e:'F<sub>s</sub> = m v² / r. F<sub>s</sub> = 2 × 3² / 0,5 = 36 N.'}]},

{t:'Loop vertikal',s:'Titik tertinggi, terendah, dan syarat kritis',st:[
`<h3>Di puncak dan di dasar lintasan</h3><div class="f">Puncak: N + w = m v² / R</div><div class="f">Dasar: N − w = m v² / R</div><div class="key">Gaya yang <b>menuju pusat</b> bernilai positif, yang <b>menjauhi pusat</b> negatif. Di dasar, N lebih besar dari w, itu sebabnya kita merasa lebih “berat”.</div><p>Di titik tertinggi, N dan w sama-sama mengarah ke pusat (ke bawah), sehingga dijumlahkan. Di titik terendah, N mengarah ke pusat (ke atas) sedangkan w mengarah keluar (ke bawah), sehingga diselisihkan.</p><p>Gaya normal yang dirasakan tubuh di dasar ayunan atau roller coaster lebih besar daripada berat sebenarnya.</p>`,
`<h3>Syarat kritis dan soal gabungan</h3><div class="f">Kritis di puncak: N = 0 &nbsp;→&nbsp; v<sub>min</sub> = √(gR)</div><div class="ex"><b>Soal.</b> Benda dilepas dari 10 m (licin) dan tepat sempurna melewati loop berjari-jari R. Di C: v² = gR. Energi A → C: g·10 = g·2R + ½·gR, jadi 10 = 2,5 R dan R = 4 m. Tinggi C = 2R = <b>8 m</b>.</div>${G(4,{H:10,R:4,m:1})} ${XL(0,2,0,'Ulas kekekalan energi →')}<p>Syarat kritis adalah batas agar benda tetap menempel pada lintasan: tepat di ambang lepas kontak saat N = 0. Itu kecepatan minimum di titik tertinggi agar benda tidak jatuh sebelum mencapai puncak.</p>`],
q:[{q:'Kecepatan minimum di titik tertinggi lintasan lingkaran vertikal (jari-jari R) agar benda tetap menempel pada lintasan ...',o:['√(gR)','gR','√(2gR)','2√(gR)'],a:0,e:'Di puncak: N + w = m v²/R. Kondisi kritis saat N = 0, sehingga m g = m v²/R. Maka v<sub>min</sub> = √(gR).'},
{q:'Penumpang roller coaster merasa paling “berat” di titik ...',o:['Tertinggi','Terendah','Tengah lintasan mendatar','Sama di semua titik'],a:1,e:'Di titik terendah N − w = m v²/R, sehingga N = w + m v²/R, lebih besar dari berat. Gaya normal inilah yang dirasakan tubuh sebagai berat.'}]},

{t:'Jurus kilat',s:'Rangkuman untuk dibaca sebelum ujian',st:[
`<h3>Peta tiga hukum</h3><div class="tip">Hampir semua soal berpola sama: gambar diagram benda bebas, tulis ΣF pada tiap sumbu, lalu samakan dengan m a (atau m v²/r untuk gerak melingkar).</div>`,
`<h3>Rumus cepat</h3><table><tr><td>Hukum I<td>ΣF = 0 → a = 0<tr><td>Hukum II<td>ΣF = m a<tr><td>Hukum III<td>F<sub>aksi</sub> = −F<sub>reaksi</sub><tr><td>Berat<td>w = m g<tr><td>Gesekan<td>f<sub>s</sub> ≤ μ<sub>s</sub> N, f<sub>k</sub> = μ<sub>k</sub> N<tr><td>Pegas<td>F = −k x<tr><td>Bidang miring<td>N = m g cos θ; ΣF<sub>sejajar</sub> = m g sin θ − f<tr><td>Melingkar<td>a<sub>s</sub> = v²/r = ω²r; F<sub>s</sub> = m v²/r = m ω² r<tr><td>Putaran<td>ω = 2πf = 2π/T; v = ω r<tr><td>Loop vertikal<td>Puncak: N + w = m v²/R; dasar: N − w = m v²/R<tr><td>Syarat kritis<td>di puncak N = 0 → v = √(gR)</table>`,
`<h3>Kata kunci dan jebakan</h3><ul><li>“licin”, “tanpa gesekan”: f = 0. “Kasar”: hitung f = μN.</li><li>“diam”, “laju tetap”, “GLB”: ΣF = 0.</li><li>Benda diam: gesekan statis = gaya dorong, bukan μ<sub>s</sub>N.</li><li>“Tepat menempel”, “kondisi kritis” di puncak loop: N = 0 dan v = √(gR).</li><li>“Melingkar beraturan”: laju tetap, tetapi a<sub>s</sub> ≠ 0 menuju pusat.</li></ul><p><b>Kesalahan umum:</b> menganggap berat dan normal pasangan aksi-reaksi, memakai N = m g pada bidang miring, memakai μ<sub>s</sub> setelah benda bergerak, menggambar F<sub>s</sub> sebagai gaya tambahan, lupa mengkuadratkan v pada v²/r, mengurangi (bukan menjumlahkan) N dan w di puncak loop, dan satuan yang belum seragam.</p>`]}];

function fold(h,mi,st){const{ILL,FT,NF}=CT();const k=mi+'.'+st,d=document.createElement('div'),x=document.createElement('details');d.innerHTML=h;
if(!NF.includes(k)){const re=FT.includes(k)?/^(P|UL|OL|TABLE)$/:/^(P|UL|OL)$/;[...d.children].filter(n=>re.test(n.tagName)).forEach(n=>x.append(n))}
const i=ILL[mi]&&ILL[mi][st];if(i){if(d.firstElementChild)d.firstElementChild.insertAdjacentHTML('afterend',i);else d.insertAdjacentHTML('afterbegin',i)}
if(x.children.length){x.insertAdjacentHTML('afterbegin','<summary>Baca penjelasan</summary>');d.append(x)}return d.innerHTML}
function quiz(items,cb){let n=0,ok=0;const box=document.createElement('div');
items.forEach((it,i)=>{const c=document.createElement('div');c.className='q';
c.innerHTML=`<p><b>${i+1}.</b> ${it.q}</p>${it.ill||''}<div class="o">${it.o.map((o,j)=>`<button data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><details class="pb"><summary>Lihat pembahasan</summary>${it.sol||''}<ol class="stp">${it.e.split('. ').map(s=>`<li><span>${s.replace(/\.$/,'')}</span></li>`).join('')}</ol>${it.sim?G(it.sim[0],it.sim[1],'Lihat simulasinya'):''}</details>`;
c.querySelector('.o').onclick=e=>{const b=e.target.closest('button');if(!b||c.dataset.d)return;c.dataset.d=1;const j=+b.dataset.j,r=j==it.a;ok+=r;n++;
c.querySelectorAll('.o button').forEach((x,k)=>{x.disabled=true;if(k==it.a)x.classList.add('ok');else if(k==j)x.classList.add('no')});
const d=c.querySelector('.pb');d.open=true;d.querySelector('summary').textContent=(r?'✓ Tepat. ':'✗ Belum tepat. ')+'Pembahasan';cb&&cb(ok,n)};box.append(c)});return box}
function vMisi(){const M=CT().M,m=M[S.mi],T=m.st.length+(m.q?1:0),q=m.q&&S.st==T-1;
$('#m').innerHTML=`<div class="path">${M.map((x,i)=>`<button data-i="${i}" class="${i==S.mi?'cur':''} ${D().m[i]?'dn':''}"><i>${D().m[i]?'✓':i+1}</i>${x.t}</button>`).join('')}</div><section class="card"><p class="sub">Misi ${S.mi+1} dari ${M.length}: ${m.s}</p><div class="dots">${Array.from({length:T},(_,i)=>`<u class="${i<=S.st?'on':''}"></u>`).join('')}</div><div id="bd"></div><div class="nb"><button id="pv" ${S.st?'':'disabled'}>Kembali</button><button id="nx" class="pri" ${q&&!D().m[S.mi]?'disabled':''}>${S.st<T-1?'Lanjut':S.mi<M.length-1?'Selesai, misi berikutnya':'Selesai, ke Latihan'}</button></div></section>`;
if(q){$('#bd').innerHTML='<h3>Tes singkat</h3>';$('#bd').append(quiz(m.q,(ok,n)=>{if(n==m.q.length)$('#nx').disabled=false}))}else $('#bd').innerHTML=fold(m.st[S.st],S.mi,S.st);
$('#pv').onclick=()=>{S.st--;draw()};
$('#nx').onclick=()=>{if(S.st<T-1){S.st++;draw();return}D().m[S.mi]=1;sv();if(S.mi<M.length-1){S.mi++;S.st=0}else S.tab='latihan';draw()}}
function vWahana(){const SIMS=CT().SIMS,sm=SIMS[S.sim],v={};sm.c.forEach(c=>v[c[0]]=c[5]);Object.assign(v,S.pre||{});S.pre=null;
$('#m').innerHTML=`<div class="path">${SIMS.map((x,i)=>`<button data-s="${i}" class="${i==S.sim?'cur':''}">${x.n}</button>`).join('')}</div><section class="card"><p class="sub">${sm.d.replace('E_m','Em')}</p><div id="sv"></div><div class="ctl">${sm.c.map(c=>`<label>${c[1]} <b id="v_${c[0]}"></b><input type="range" data-k="${c[0]}" min="${c[2]}" max="${c[3]}" step="${c[4]}" value="${v[c[0]]}"></label>`).join('')}</div><div class="out" id="out"></div></section>`;
const ins=[...document.querySelectorAll('#m input')],up=()=>{ins.forEach(i=>{v[i.dataset.k]=+i.value;$('#v_'+i.dataset.k).textContent=f(+i.value,2)});const r=sm.r(v);$('#sv').innerHTML=r.svg;$('#out').innerHTML=r.out};
ins.forEach(i=>i.oninput=up);up()}
function vLat(){const{LQ,TF}=CT();$('#m').innerHTML=`<section class="card"><p class="sub">Latihan dengan g = 10 m/s². Pembahasan bisa dibuka kapan saja, tanpa perlu menjawab dulu.</p><p class="sc" id="sc"></p><button class="tg" id="ao">Buka semua pembahasan</button><h3>Soal pilihan</h3><div id="l1"></div><h3>Benar atau salah?</h3><div id="l2"></div></section>`;
let a=0,b=0;const up=()=>$('#sc').textContent=`Benar ${a+b} dari ${LQ.length+TF.length} soal`;up();
$('#l1').append(quiz(LQ,ok=>{a=ok;up()}));$('#l2').append(quiz(TF,ok=>{b=ok;up()}));let o=0;$('#ao').onclick=e=>{o=!o;document.querySelectorAll('.pb').forEach(d=>d.open=o);e.target.textContent=o?'Tutup semua pembahasan':'Buka semua pembahasan'}}
function tpd(){$('#tp').innerHTML=TOP.map((t,i)=>`<button data-top="${i}" class="${i==S.top?'on':''}"><span class="ti">${t.ic}</span><span><b>${t.name}</b><small>${Object.keys(DD[i].m).length} dari ${t.M.length} misi selesai</small></span></button>`).join('')}
function draw(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
$('#pr').textContent='⭐ '+Object.keys(D().m).length+'/'+CT().M.length;tpd();({misi:vMisi,wahana:vWahana,latihan:vLat})[S.tab]();scrollTo(0,0)}
$('#tp').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.top=+b.dataset.top;const i=CT().M.findIndex((_,j)=>!D().m[j]);S.mi=i<0?0:i;S.st=0;S.sim=0;S.pre=null;draw()};
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;draw()}};
$('#m').onclick=e=>{const t=e.target,p=t.closest('.path button'),g=t.closest('.go');
if(p&&p.dataset.i!=null){S.mi=+p.dataset.i;S.st=0;draw()}else if(p&&p.dataset.s!=null){S.sim=+p.dataset.s;draw()}
if(g&&g.classList.contains('xl')){S.top=+g.dataset.top;S.tab='misi';S.mi=+g.dataset.mi;S.st=+g.dataset.st;draw()}else if(g){S.tab='wahana';S.sim=+g.dataset.sim;S.pre=JSON.parse(g.dataset.pre);draw()}};
draw();
